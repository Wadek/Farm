name: verify

on:
  pull_request:
  push:
    branches:
      - main
      - "frontier/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: pytest tests/ -v --tb=short
