name: satokori

# Sibling app under D:\wakalabs (moved off C:).
# Joins external docker network waka-net for gateway routing.

services:
  satokori:
    build: .
    container_name: satokori
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/farm.db
      SECRET_KEY: ${SATOKORI_SECRET_KEY:-satokori-local}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://satokori.com}
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      SMS_FROM: ${SMS_FROM:-Satokori}
      ELKS_USERNAME: ${ELKS_USERNAME:-}
      ELKS_PASSWORD: ${ELKS_PASSWORD:-}
      TWILIO_SID: ${TWILIO_SID:-}
      TWILIO_TOKEN: ${TWILIO_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_CONTACT: ${VAPID_CONTACT:-mailto:satokori@wakalabs.net}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8791:8080"
    networks:
      - waka-net

networks:
  waka-net:
    external: true
